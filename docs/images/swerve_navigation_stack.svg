<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">B-Spline, MPC and EKF navigation stack</title>
  <desc id="desc">A heart-shaped B-Spline path feeds an MPC controller while wheel and IMU measurements are fused by an EKF.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="mpc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="ekf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M0 92 H1200 M0 430 H1200" stroke="#1e3a56" stroke-width="1" opacity="0.55"/>
  <circle cx="1080" cy="80" r="180" fill="#2563eb" opacity="0.06"/>
  <circle cx="120" cy="470" r="210" fill="#7c3aed" opacity="0.06"/>

  <text x="60" y="58" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">AT32 4-SWERVE AUTONOMOUS NAVIGATION</text>
  <text x="1140" y="58" text-anchor="end" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">REAL-TIME · ON-VEHICLE</text>

  <g transform="translate(50 112)" filter="url(#shadow)">
    <rect width="330" height="270" rx="24" fill="#0d2238" stroke="#1e4f72" stroke-width="2"/>
    <text x="28" y="42" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">01 · B-SPLINE</text>
    <text x="28" y="69" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Smooth path · Arc-length LUT · Curvature</text>
    <path d="M165 224 C92 174 58 128 91 102 C116 82 151 95 165 122 C179 95 214 82 239 102 C272 128 238 174 165 224 Z"
          fill="none" stroke="url(#heart)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M86 104 L122 90 L165 122 L210 91 L244 104 L228 163 L165 224 L101 164 Z"
          fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.8"/>
    <g fill="#e0f2fe" stroke="#38bdf8" stroke-width="2">
      <circle cx="86" cy="104" r="4"/><circle cx="122" cy="90" r="4"/><circle cx="165" cy="122" r="4"/>
      <circle cx="210" cy="91" r="4"/><circle cx="244" cy="104" r="4"/><circle cx="228" cy="163" r="4"/>
      <circle cx="165" cy="224" r="4"/><circle cx="101" cy="164" r="4"/>
    </g>
  </g>

  <path d="M398 247 H446" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(456 112)" filter="url(#shadow)">
    <rect width="288" height="270" rx="24" fill="#251a10" stroke="#92400e" stroke-width="2"/>
    <text x="28" y="42" fill="#fdba74" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">02 · MPC</text>
    <text x="28" y="69" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Predict · Optimize · Constrain</text>
    <g transform="translate(34 104)">
      <path d="M5 114 C52 92 70 38 111 51 C148 63 158 22 213 16" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="7 7"/>
      <g fill="url(#mpc)" filter="url(#glow)">
        <circle cx="5" cy="114" r="8"/><circle cx="56" cy="84" r="7"/><circle cx="103" cy="53" r="7"/>
        <circle cx="153" cy="46" r="7"/><circle cx="213" cy="16" r="8"/>
      </g>
      <path d="M5 114 L56 84 L103 53 L153 46 L213 16" fill="none" stroke="url(#mpc)" stroke-width="5" stroke-linecap="round"/>
      <text x="0" y="148" fill="#94a3b8" font-family="Consolas, monospace" font-size="13">N = 5  ·  dt = 20 ms</text>
    </g>
  </g>

  <path d="M762 247 H810" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(820 112)" filter="url(#shadow)">
    <rect width="330" height="270" rx="24" fill="#0c261f" stroke="#13795b" stroke-width="2"/>
    <text x="28" y="42" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">03 · EKF</text>
    <text x="28" y="69" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Wheel rate · Gyro Z · Yaw anchor</text>
    <g transform="translate(28 96)">
      <rect x="0" y="0" width="92" height="42" rx="10" fill="#12362e" stroke="#2dd4bf"/>
      <rect x="0" y="58" width="92" height="42" rx="10" fill="#12362e" stroke="#2dd4bf"/>
      <rect x="0" y="116" width="92" height="42" rx="10" fill="#12362e" stroke="#2dd4bf"/>
      <text x="46" y="26" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, Arial, sans-serif" font-size="13">WHEELS</text>
      <text x="46" y="84" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, Arial, sans-serif" font-size="13">GYRO Z</text>
      <text x="46" y="142" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, Arial, sans-serif" font-size="13">YAW</text>
      <path d="M100 21 H145 M100 79 H145 M100 137 H145" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="154" y="35" width="116" height="110" rx="18" fill="url(#ekf)" opacity="0.92"/>
      <text x="212" y="82" text-anchor="middle" fill="#052e2b" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">EKF</text>
      <text x="212" y="108" text-anchor="middle" fill="#064e3b" font-family="Consolas, monospace" font-size="10">yaw · rate · bias</text>
    </g>
  </g>

  <g transform="translate(50 448)">
    <rect width="1100" height="46" rx="15" fill="#0f2942" stroke="#1d4f72"/>
    <text x="550" y="30" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">B-SPLINE PATH  ×  EMBEDDED MPC  ×  YAW EKF   |   LATERAL ≤ 5 cm   ·   LONGITUDINAL ≤ 5 cm</text>
  </g>
</svg>
